services:
  goal-calendar-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "goal-calendar"
      nucleus.depends: "mongo"
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      PORT: 3001
    volumes:
      - ./server:/app
      - ../../core:/app/core:ro
      - goal_calendar_server_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/goals',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  goal-calendar:
    build:
      context: ./client
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-client"
      nucleus.app: "goal-calendar"
    environment:
      # Vite dev server's allowedHosts reads this (see client/vite.config.js).
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - ../../core:/app/core:ro
      # Widget package, so core/AuthGuard's @widgets-core import resolves (Pulse
      # widgets can float in this app). Mirrors the hub. Read-only.
      - ../../widgets:/app/widgets:ro
    depends_on:
      goal-calendar-server:
        condition: service_healthy

volumes:
  goal_calendar_server_modules:
